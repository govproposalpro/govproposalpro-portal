# Render Blueprint: creates the Node web service and a managed Postgres database.
# Render dashboard -> New -> Blueprint -> pick the repo containing this folder.
services:
  - type: web
    name: govproposalpro-portal
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: govproposalpro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false" # Render's internal connection string doesn't use TLS
      - key: REQUIRE_PURCHASE
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: EMAIL_PROVIDER
        value: ghl
      - key: ALLOWED_ORIGINS
        sync: false # set to your GoHighLevel page origin, e.g. https://access.yourdomain.com
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      # --- Command Center (dashboard at /app) ---
      - key: ANTHROPIC_API_KEY
        sync: false # Claude API key for the Proposal Engine and Bid Decryptor
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true # encrypts the API keys and mailbox passwords members give the Autopilot; never change it once set
      - key: APP_LAUNCH_AT
        value: "2026-10-18T13:00:00Z" # members can sign in from Sunday Oct 18, 9:00 AM Eastern
      - key: APP_EARLY_ACCESS_EMAILS
        sync: false # comma-separated emails allowed to sign in before launch (the team)
      - key: SAM_API_KEY
        sync: false # SAM.gov public API key for Sub-Safe vetting (sam.gov > Account Details > API Key)
      - key: GOOGLE_PLACES_API_KEY
        sync: false # optional, Enterprise top-rated subs (Google Places API New)
      - key: SITE_CTA_URL
        sync: false # landing page "Get access" button (https)
      - key: WHOP_CORE_CHECKOUT_URL
        sync: false # landing page "Get Core" button (https Whop checkout link)
      - key: WHOP_ENTERPRISE_CHECKOUT_URL
        sync: false # landing page "Get Enterprise" button
      - key: WHOP_CORE_PLAN_ID
        sync: false # optional: embedded checkout plan ids, defaults are the live plans
      - key: WHOP_ENTERPRISE_PLAN_ID
        sync: false
      - key: WHOP_CORE_ACCESS_PLAN_ID
        sync: false
      - key: WHOP_ENTERPRISE_ACCESS_PLAN_ID
        sync: false
      - key: WHOP_CORE_MONTHLY_PLAN_ID
        sync: false # optional: $199/mo Core plan (default plan_3fn88Y0V7nDy8); access ends when this membership ends
      - key: WHOP_ENTERPRISE_MONTHLY_PLAN_ID
        sync: false # optional: $999/mo Enterprise plan (default plan_dodFFyk8v95Fv)
      - key: CORE_ACCESS_MONTHLY_PRICE
        sync: false # optional: Core maintenance $/month, shows the "save" line on pay-in-full
      - key: ENTERPRISE_ACCESS_MONTHLY_PRICE
        sync: false # optional: Enterprise maintenance $/month
      - key: BOOKING_URL
        sync: false # optional: free call calendar (GoHighLevel); shows "Book a call" on the site and in emails
      - key: SITE_VSL_YOUTUBE_ID
        sync: false # optional: 11-character YouTube id of the demo video; shows "Watch the demo"
      - key: SITE_CHECKOUT_MODE
        sync: false # "link" sends buy buttons to whop.com instead of the on-page checkout
      - key: LEGAL_ENTITY
        sync: false # legal business name on /terms and /privacy, e.g. Contract Bros LLC
      - key: LEGAL_STATE
        sync: false # governing-law state for /terms, e.g. Texas
      - key: SUPPORT_EMAIL
        sync: false # contact email on /terms and /privacy
      # --- Admin dashboard (at /admin) ---
      - key: ADMIN_OWNER_EMAILS
        value: "jalen@contractbros.com,kinno@contractbros.com" # owners; created on deploy, emailed a setup link
      - key: ADMIN_VA_EMAILS
        value: "va1@govproposalpro.com,va2@govproposalpro.com,va3@govproposalpro.com,va4@govproposalpro.com,va5@govproposalpro.com"
      - key: APP_BASE_URL
        value: "https://access.govproposalpro.com" # used in password reset and setup links

databases:
  - name: govproposalpro-db
    plan: basic-256mb
